# Fine-tuning PaddleOCR's recogniser (v0.3). From the PaddleOCR repository's
# configs/rec/PP-OCRv6/PP-OCRv6_medium_rec.yml; what differs:
#   - the dictionary: tools/train_lines.py's, which holds every Vietnamese letter. The
#     stock one lacks most; its heads do not fit, so they start fresh and the backbone
#     is kept (the loader skips weights whose shape differs).
#   - max_text_length 40, not 25: these lines run longer.
#   - no RecConAug: it glues two crops together with no space in the label, which
#     teaches the joined figures this training should remove.
#   - fewer epochs, a lower rate and a smaller batch, for fine-tuning on 8 GB.
# Paths are relative to the PaddleOCR checkout, as tools/train_rec.sh runs it.
Global:
  model_name: PP-OCRv6_medium_rec
  debug: false
  use_gpu: true
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: ../output
  save_epoch_step: 5
  eval_batch_step: [0, 3000]
  cal_metric_during_train: true
  pretrained_model: ../PP-OCRv6_medium_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: ../data/dict.txt
  max_text_length: &max_text_length 40
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ../output/predicts.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0003
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 192
            depth: 2
            mlp_ratio: 4.0
            local_kernel: 7
            use_guide: false
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ../data/
    ext_op_transform_idx: 1
    label_file_list:
    - ../data/train_list.txt
    ratio_list:
    - 1.0
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 48
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ../data
    label_file_list:
    - ../data/val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 96
    num_workers: 4

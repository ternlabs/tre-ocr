<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set F check</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dcdad4;
  --accent: #1f5fbf; --ok: #2e7d32; --warn: #b26a00; --bad: #b3261e; --mark: #fff1c2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #e8e6e1; --muted: #9a988f; --line: #34332f;
    --accent: #7aa7ff; --ok: #7bc47f; --warn: #f0b45a; --bad: #ff8a80; --mark: #4a3f14;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
       display: grid; grid-template-rows: auto 1fr; }
header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px;
         border-bottom: 1px solid var(--line); background: var(--panel); }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
         border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
      color: var(--muted); }
.spacer { flex: 1; }
.muted { color: var(--muted); }
#dots { display: flex; gap: 3px; flex-wrap: wrap; max-height: 52px; overflow: auto; flex: 1; }
#dots button { width: 22px; height: 22px; padding: 0; font-size: 11px; border-radius: 4px; }
#dots button.now { outline: 2px solid var(--accent); outline-offset: 1px; }
#dots button.ok, #dots button.typed { background: var(--ok); color: #fff; border-color: var(--ok); }
#dots button.absent { background: var(--bad); color: #fff; border-color: var(--bad); }
#dots button.unsure { background: var(--warn); color: #fff; border-color: var(--warn); }
main { display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
#imgpane { overflow: auto; background: #8a8a8a; }
#sheet { position: relative; margin: 0 auto; }
#sheet img { display: block; width: 100%; }
.box { position: absolute; border: 2px solid #e6007e; background: rgba(230, 0, 126, .12); pointer-events: none; }
.box.piece { border-style: dashed; }
.box.now { border-color: #0066ff; border-width: 3px; background: rgba(0, 102, 255, .14); }
body.nobox .box { display: none; }
#side { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 14px;
        display: flex; flex-direction: column; gap: 14px; }
#side h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
#kind { font: 600 18px/1.3 system-ui, sans-serif; }
#ask { color: var(--muted); }
.ctx { border-left: 3px solid var(--line); padding-left: 8px; overflow-wrap: anywhere; font: 14px ui-monospace, monospace; }
.ctx .near { color: var(--muted); }
.mask { background: var(--mark); font-weight: 600; padding: 0 6px; border-radius: 3px; }
#shown { font: 600 26px/1.25 ui-monospace, monospace; overflow-wrap: anywhere; }
#value { font: 600 22px ui-monospace, monospace; width: 100%; padding: 6px 8px; border: 1px solid var(--line);
         border-radius: 6px; background: var(--panel); color: var(--ink); }
.answers button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.answers button.sel kbd { color: inherit; border-color: currentColor; }
#done { padding: 10px; border: 1px solid var(--ok); border-radius: 6px; }
code { font: 12px ui-monospace, monospace; overflow-wrap: anywhere; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <button id="prev" title="Previous">&larr;</button>
  <button id="next" title="Next">&rarr;</button>
  <span id="dots"></span>
  <span class="spacer"></span>
  <span id="count" class="muted"></span>
  <button id="out" title="Zoom out">&minus;</button>
  <button id="in" title="Zoom in">+</button>
  <button id="toggle" title="Show or hide the boxes">Boxes</button>
</header>
<main>
  <div id="imgpane"><div id="sheet"><img id="img" alt="Scan of the page"></div></div>
  <aside id="side">
    <div>
      <div id="kind"></div>
      <div id="ask"></div>
    </div>
    <div id="shown"></div>
    <div id="ctx"></div>
    <input id="value" autocomplete="off" spellcheck="false">
    <div class="answers">
      <button data-a="ok" id="okbtn">Right as shown <kbd>Enter</kbd> on an empty box</button>
      <button data-a="typed">Save what I typed <kbd>Enter</kbd></button>
      <button data-a="absent" id="absentbtn">No number printed there</button>
      <button data-a="unsure">Unsure: can't read it</button>
    </div>
    <div id="done" hidden></div>
    <div id="cands"></div>
    <div class="muted">Answer from the image only. Type numbers as printed, with their dots and commas.
      Boxes mark where Tesseract saw digits like the ones asked for; they say where to look, not what is there.
      <kbd>Alt</kbd>+<kbd>&larr;</kbd> <kbd>&rarr;</kbd> move, <kbd>Alt</kbd>+<kbd>C</kbd> next box.</div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
let items = [], answers = {}, at = 0, zoom = 1.6, box = 0;
const KIND = {
  type:    ["Number", "Find the masked number on the scan and type it as printed."],
  extra:   ["Number a reader saw", "A reader read a number here. Type what is printed at the mask, or say none is."],
  tick:    ["Number to confirm", "Is this number printed exactly so on the line shown? Enter if right, or type it as printed."],
  company: ["Company field", "Is this the company name in the heading, top left, exactly? Enter if right, or type it as printed."],
};

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function sizeSheet() { $("sheet").style.width = (zoom * ($("imgpane").clientWidth - 2)) + "px"; }

function focusBox(i) {
  const list = items[at].boxes;
  document.querySelectorAll(".box").forEach((b, j) => b.classList.toggle("now", j === i));
  if (!list.length) { $("imgpane").scrollTop = 0; $("imgpane").scrollLeft = 0; return; }
  box = i;
  const s = $("sheet"), p = $("imgpane"), b = list[i];
  p.scrollTop = s.offsetTop + b.y * s.offsetHeight - p.clientHeight / 2;
  p.scrollLeft = s.offsetLeft + b.x * s.offsetWidth - p.clientWidth / 2;
}

function drawDots() {
  $("dots").replaceChildren(...items.map((r, i) => {
    const b = el("button", i + 1, ((answers[r.id] || {}).answer || "") + (i === at ? " now" : ""));
    b.title = KIND[r.kind][0];
    b.onclick = () => show(i);
    return b;
  }));
  const left = items.filter(r => !answers[r.id]).length;
  $("count").textContent = `${left} of ${items.length} left`;
  $("done").hidden = left > 0;
  if (!left) $("done").replaceChildren(el("div", "All answered. Then run:"),
                                       el("code", "python -I tools/check_f.py --finish"));
}

function show(i) {
  at = Math.max(0, Math.min(items.length - 1, i));
  const r = items[at], x = answers[r.id];
  $("kind").textContent = KIND[r.kind][0];
  $("ask").textContent = KIND[r.kind][1];
  $("shown").textContent = r.shown || "";
  $("okbtn").hidden = !r.shown;
  $("absentbtn").hidden = !(r.kind === "type" || r.kind === "extra");
  const ctx = $("ctx");
  ctx.replaceChildren();
  if (r.context) {
    const d = el("div", null, "ctx");
    if (r.context.before) d.append(el("div", r.context.before, "near"));
    const line = el("div"), parts = r.context.line.split("\0");
    line.append(parts[0]);
    if (parts.length > 1) line.append(el("span", "?", "mask"), parts[1]);
    d.append(line);
    if (r.context.after) d.append(el("div", r.context.after, "near"));
    ctx.append(d);
  }
  $("value").value = x && x.answer === "typed" ? x.value : "";
  document.querySelectorAll(".answers button").forEach(b => b.classList.toggle("sel", !!x && b.dataset.a === x.answer));
  $("prev").disabled = at === 0;
  $("next").disabled = at === items.length - 1;

  const sheet = $("sheet"), img = $("img");
  sheet.querySelectorAll(".box").forEach(b => b.remove());
  r.boxes.forEach(b => {
    const d = el("div", null, "box");
    Object.assign(d.style, { left: b.x * 100 + "%", top: b.y * 100 + "%", width: b.w * 100 + "%", height: b.h * 100 + "%" });
    sheet.append(d);
  });
  img.onload = () => focusBox(0);
  const src = `img/${r.key}.png`;
  if (img.getAttribute("src") !== src) img.src = src; else focusBox(0);
  const cands = $("cands");
  if (r.boxes.length > 1) {
    const nb = el("button", `${r.boxes.length} boxes on this page: go to next`);
    nb.onclick = () => focusBox((box + 1) % r.boxes.length);
    cands.replaceChildren(nb);
  } else cands.replaceChildren();
  drawDots();
  $("value").focus();
}

async function answer(a) {
  const r = items[at], value = $("value").value.trim();
  if (a === "typed" && !value) { $("value").focus(); return; }
  const body = { id: r.id, answer: a, value: a === "typed" ? value : "" };
  const res = await fetch("api/answer", { method: "POST", body: JSON.stringify(body) });
  if (!res.ok) { alert("Not saved: " + (await res.text())); return; }
  answers[r.id] = { answer: a, value: body.value };
  const next = items.findIndex((x, i) => i > at && !answers[x.id]);
  show(next >= 0 ? next : at);
}

function setZoom(z) { zoom = Math.max(1, Math.min(4, z)); sizeSheet(); focusBox(box); }

$("prev").onclick = () => show(at - 1);
$("next").onclick = () => show(at + 1);
$("in").onclick = () => setZoom(zoom * 1.3);
$("out").onclick = () => setZoom(zoom / 1.3);
$("toggle").onclick = () => document.body.classList.toggle("nobox");
document.querySelectorAll(".answers button").forEach(b => b.onclick = () => answer(b.dataset.a));
window.addEventListener("resize", sizeSheet);
document.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    if ($("value").value.trim()) answer("typed");
    else if (items[at].shown) answer("ok");
  } else if (e.altKey && e.key === "ArrowLeft") show(at - 1);
  else if (e.altKey && e.key === "ArrowRight") show(at + 1);
  else if (e.altKey && e.key.toLowerCase() === "c" && items[at].boxes.length) focusBox((box + 1) % items[at].boxes.length);
});

fetch("api/items").then(r => r.json()).then(d => {
  items = d.items; answers = d.answers;
  sizeSheet();
  const first = items.findIndex(r => !answers[r.id]);
  show(first >= 0 ? first : 0);
});
</script>
</body>
</html>

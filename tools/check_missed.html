<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missed numbers</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dcdad4;
  --accent: #1f5fbf; --ok: #2e7d32; --warn: #b26a00; --bad: #b3261e; --mark: #fff1c2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #e8e6e1; --muted: #9a988f; --line: #34332f;
    --accent: #7aa7ff; --ok: #7bc47f; --warn: #f0b45a; --bad: #ff8a80; --mark: #4a3f14;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
       display: grid; grid-template-rows: auto 1fr; }
header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px;
         border-bottom: 1px solid var(--line); background: var(--panel); }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
         border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
      color: var(--muted); }
.spacer { flex: 1; }
.muted { color: var(--muted); }
#dots { display: flex; gap: 3px; flex-wrap: wrap; }
#dots button { width: 22px; height: 22px; padding: 0; font-size: 11px; border-radius: 4px; }
#dots button.now { outline: 2px solid var(--accent); outline-offset: 1px; }
#dots button.on { background: var(--ok); color: #fff; border-color: var(--ok); }
#dots button.off { background: var(--bad); color: #fff; border-color: var(--bad); }
#dots button.unsure { background: var(--warn); color: #fff; border-color: var(--warn); }
main { display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
#imgpane { overflow: auto; background: #8a8a8a; }
#sheet { position: relative; margin: 0 auto; }
#sheet img { display: block; width: 100%; }
.box { position: absolute; border: 2px solid #e6007e; background: rgba(230, 0, 126, .12); pointer-events: none; }
.box.piece { border-style: dashed; }
.box.now { border-color: #0066ff; border-width: 3px; background: rgba(0, 102, 255, .14); }
body.nobox .box { display: none; }
#side { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 14px;
        display: flex; flex-direction: column; gap: 14px; }
#side h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
#number { font: 600 30px/1.2 ui-monospace, monospace; overflow-wrap: anywhere; }
#forms { font: 14px ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
.place { border-left: 3px solid var(--line); padding-left: 8px; margin-bottom: 6px; overflow-wrap: anywhere; }
mark { background: var(--mark); color: inherit; font-weight: 600; }
.answers { display: grid; gap: 6px; }
.answers button { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; text-align: left; }
.answers button.on.sel { background: var(--ok); border-color: var(--ok); color: #fff; }
.answers button.off.sel { background: var(--bad); border-color: var(--bad); color: #fff; }
.answers button.unsure.sel { background: var(--warn); border-color: var(--warn); color: #fff; }
.answers button.sel kbd { color: inherit; border-color: currentColor; }
#done { padding: 10px; border: 1px solid var(--ok); border-radius: 6px; }
code { font: 12px ui-monospace, monospace; overflow-wrap: anywhere; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <button id="prev" title="Previous">&larr;</button>
  <button id="next" title="Next">&rarr;</button>
  <span id="dots"></span>
  <span class="spacer"></span>
  <span id="count" class="muted"></span>
  <button id="out" title="Zoom out">&minus;</button>
  <button id="in" title="Zoom in">+</button>
  <button id="toggle" title="Show or hide the boxes">Boxes <kbd>B</kbd></button>
</header>
<main>
  <div id="imgpane"><div id="sheet"><img id="img" alt="Scan of the page"></div></div>
  <aside id="side">
    <div>
      <h2>Is this number on the scan?</h2>
      <div id="number"></div>
      <div id="forms"></div>
      <div id="where" class="muted"></div>
    </div>
    <div class="answers">
      <button class="on" data-a="on">On the scan: a real miss <kbd>O</kbd></button>
      <button class="off" data-a="off">Not on the scan: excuse it <kbd>N</kbd></button>
      <button class="unsure" data-a="unsure">Unsure: stays a miss <kbd>U</kbd></button>
    </div>
    <div id="done" hidden></div>
    <div>
      <h2>Boxes: where Tesseract saw similar digits</h2>
      <div id="cands"></div>
    </div>
    <div>
      <h2>In the English twin</h2>
      <div id="twin"></div>
    </div>
    <div>
      <h2>Closest number each engine read</h2>
      <div id="reads"></div>
    </div>
    <div class="muted">Answer from the image. All the digits must stand together on the scan;
      the separators may differ. <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move, <kbd>+</kbd> <kbd>&minus;</kbd> zoom,
      <kbd>C</kbd> next box.</div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
let rows = [], answers = {}, excuse = "", at = 0, zoom = 1, box = 0;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function grouped(n, sep) {
  return n.replace(/\B(?=(\d{3})+$)/g, sep);
}

function sizeSheet() {
  $("sheet").style.width = (zoom * ($("imgpane").clientWidth - 2)) + "px";
}

function focusBox(i) {
  const list = rows[at].boxes;
  document.querySelectorAll(".box").forEach((b, j) => b.classList.toggle("now", j === i));
  if (!list.length) { $("imgpane").scrollTop = 0; return; }
  box = i;
  const s = $("sheet"), p = $("imgpane"), b = list[i];
  p.scrollTop = s.offsetTop + b.y * s.offsetHeight - p.clientHeight / 2;
  p.scrollLeft = s.offsetLeft + b.x * s.offsetWidth - p.clientWidth / 2;
}

function drawDots() {
  const d = $("dots");
  d.replaceChildren(...rows.map((r, i) => {
    const b = el("button", i + 1, (answers[r.id] || "") + (i === at ? " now" : ""));
    b.onclick = () => show(i);
    return b;
  }));
  const n = a => Object.values(answers).filter(x => x === a).length;
  const left = rows.length - Object.keys(answers).length;
  $("count").textContent = `${left} left · ${n("on")} on · ${n("off")} excused · ${n("unsure")} unsure`;
  const done = $("done");
  done.hidden = left > 0;
  if (!left) {
    done.replaceChildren(el("div", `All answered. ${n("off")} written to ${excuse}. Score again with:`),
                         el("code", "python -I tools/score.py a data/runs/*-a.jsonl"));
  }
}

function drawAnswer() {
  document.querySelectorAll(".answers button").forEach(b =>
    b.classList.toggle("sel", b.dataset.a === answers[rows[at].id]));
}

function show(i) {
  at = Math.max(0, Math.min(rows.length - 1, i));
  const r = rows[at];
  $("number").textContent = r.number;
  $("forms").textContent = r.number.length > 3 ? `${grouped(r.number, ".")}   ${grouped(r.number, ",")}` : "";
  $("where").textContent = `Page ${r.page} of ${r.key.slice(0, 8)} · stamp: ${r.stamp}`;
  $("prev").disabled = at === 0;
  $("next").disabled = at === rows.length - 1;

  const sheet = $("sheet"), img = $("img");
  sheet.querySelectorAll(".box").forEach(b => b.remove());
  r.boxes.forEach(b => {
    const d = el("div", null, "box" + (b.differ >= r.number.length ? " piece" : ""));
    Object.assign(d.style, { left: b.x * 100 + "%", top: b.y * 100 + "%", width: b.w * 100 + "%", height: b.h * 100 + "%" });
    sheet.append(d);
  });
  img.onload = () => focusBox(0);
  const src = `img/${r.key}.png`;
  if (img.getAttribute("src") !== src) img.src = src; else focusBox(0);

  const cands = $("cands");
  if (r.boxes.length) {
    const nb = el("button", `${r.boxes.length} on this page: go to next`);
    nb.onclick = () => focusBox((box + 1) % r.boxes.length);
    cands.replaceChildren(nb);
  } else {
    cands.replaceChildren(el("div", "None. Use the twin's wording to find the place.", "muted"));
  }

  const twin = $("twin");
  twin.replaceChildren(...(r.twin.length ? r.twin.map(p => {
    const d = el("div", null, "place");
    d.append("…" + p.before, el("mark", p.match), p.after + "…");
    return d;
  }) : [el("div", "Not found in the twin's text.", "muted")]));

  const reads = $("reads");
  reads.replaceChildren(...Object.entries(r.reads).map(([name, x]) => {
    const d = el("div", null, "place");
    d.append(el("div", x ? `${name}: ${x.read} (${x.differ} ${x.differ === 1 ? "edit" : "edits"} away)` : `${name}: nothing close`));
    if (x) d.append(el("div", x.line, "muted"));
    return d;
  }));
  drawAnswer();
  drawDots();
}

async function answer(a) {
  const r = rows[at], was = answers[r.id];
  const now = was === a ? null : a;             // a second click takes the answer back
  const res = await fetch("api/answer", { method: "POST", body: JSON.stringify({ id: r.id, answer: now }) });
  if (!res.ok) { alert("Not saved: " + (await res.text())); return; }
  if (now) answers[r.id] = now; else delete answers[r.id];
  drawAnswer();
  drawDots();
  if (now && !was) {
    const next = rows.findIndex((x, i) => i > at && !answers[x.id]);
    if (next >= 0) show(next);
  }
}

function setZoom(z) {
  zoom = Math.max(1, Math.min(4, z));
  sizeSheet();
  focusBox(box);
}

$("prev").onclick = () => show(at - 1);
$("next").onclick = () => show(at + 1);
$("in").onclick = () => setZoom(zoom * 1.3);
$("out").onclick = () => setZoom(zoom / 1.3);
$("toggle").onclick = () => document.body.classList.toggle("nobox");
document.querySelectorAll(".answers button").forEach(b => b.onclick = () => answer(b.dataset.a));
window.addEventListener("resize", sizeSheet);
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "o") answer("on");
  else if (k === "n") answer("off");
  else if (k === "u") answer("unsure");
  else if (k === "b") $("toggle").click();
  else if (k === "c" && rows[at].boxes.length) focusBox((box + 1) % rows[at].boxes.length);
  else if (e.key === "ArrowLeft") show(at - 1);
  else if (e.key === "ArrowRight") show(at + 1);
  else if (e.key === "+" || e.key === "=") setZoom(zoom * 1.3);
  else if (e.key === "-") setZoom(zoom / 1.3);
});

fetch("api/rows").then(r => r.json()).then(d => {
  rows = d.rows; answers = d.answers; excuse = d.excuse;
  zoom = 1.6;
  sizeSheet();
  const first = rows.findIndex(r => !answers[r.id]);
  show(first >= 0 ? first : 0);
});
</script>
</body>
</html>
